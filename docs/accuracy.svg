<svg xmlns="http://www.w3.org/2000/svg" width="720" height="348" viewBox="0 0 720 348" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>Execution accuracy by context, original vs corrected label</title><desc>Schema only: original 40%, corrected 41%; + BIRD data dictionary: original 43%, corrected 39%; + BIRD hint per question: original 68%, corrected 58%; + Context layer: original 40%, corrected 44%</desc>
<rect width="720" height="348" rx="8" fill="#fcfcfb"/>
<text x="24" y="36" font-size="17" font-weight="600" fill="#0b0b0b">Correcting the labels costs BIRD&#x27;s hints 10 points</text>
<text x="24" y="58" font-size="13" fill="#52514e">BIRD california_schools, 30 questions × 3 runs, DeepSeek V4.1 Flash. Execution accuracy, %.</text>
<circle cx="30" cy="84" r="6" fill="#86b6ef"/>
<text x="42" y="88.5" font-size="13" fill="#52514e">Original label</text>
<circle cx="180" cy="84" r="6" fill="#1c5cab"/>
<text x="192" y="88.5" font-size="13" fill="#52514e">Corrected label</text>
<line x1="200.0" y1="110" x2="200.0" y2="294.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="200.0" y="312.0" font-size="12" text-anchor="middle" fill="#898781">0</text>
<line x1="316.0" y1="110" x2="316.0" y2="294.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="316.0" y="312.0" font-size="12" text-anchor="middle" fill="#898781">25</text>
<line x1="432.0" y1="110" x2="432.0" y2="294.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="432.0" y="312.0" font-size="12" text-anchor="middle" fill="#898781">50</text>
<line x1="548.0" y1="110" x2="548.0" y2="294.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="548.0" y="312.0" font-size="12" text-anchor="middle" fill="#898781">75</text>
<line x1="664.0" y1="110" x2="664.0" y2="294.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="664.0" y="312.0" font-size="12" text-anchor="middle" fill="#898781">100</text>
<text x="184" y="132.5" font-size="13" text-anchor="end" fill="#0b0b0b">Schema only</text>
<line x1="385.6" y1="128" x2="390.7555555555556" y2="128" stroke="#c3c2b7" stroke-width="2"/>
<circle cx="385.6" cy="128" r="6" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="390.8" cy="128" r="6" fill="#1c5cab" stroke="#fcfcfb" stroke-width="2"/>
<text x="402.8" y="132.5" font-size="12" text-anchor="start" fill="#0b0b0b">40% → 41%</text>
<text x="184" y="176.5" font-size="13" text-anchor="end" fill="#0b0b0b">+ BIRD data dictionary</text>
<line x1="401.06666666666666" y1="172" x2="380.44444444444446" y2="172" stroke="#c3c2b7" stroke-width="2"/>
<circle cx="401.1" cy="172" r="6" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="380.4" cy="172" r="6" fill="#1c5cab" stroke="#fcfcfb" stroke-width="2"/>
<text x="413.1" y="176.5" font-size="12" text-anchor="start" fill="#0b0b0b">43%</text>
<text x="368.4" y="176.5" font-size="12" text-anchor="end" fill="#0b0b0b">39%</text>
<text x="184" y="220.5" font-size="13" text-anchor="end" fill="#0b0b0b">+ BIRD hint per question</text>
<line x1="514.4888888888888" y1="216" x2="468.08888888888885" y2="216" stroke="#c3c2b7" stroke-width="2"/>
<circle cx="514.5" cy="216" r="6" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="468.1" cy="216" r="6" fill="#1c5cab" stroke="#fcfcfb" stroke-width="2"/>
<text x="526.5" y="220.5" font-size="12" text-anchor="start" fill="#0b0b0b">68%</text>
<text x="456.1" y="220.5" font-size="12" text-anchor="end" fill="#0b0b0b">58%</text>
<text x="184" y="264.5" font-size="13" text-anchor="end" fill="#0b0b0b">+ Context layer</text>
<line x1="385.6" y1="260" x2="406.2222222222222" y2="260" stroke="#c3c2b7" stroke-width="2"/>
<circle cx="385.6" cy="260" r="6" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="406.2" cy="260" r="6" fill="#1c5cab" stroke="#fcfcfb" stroke-width="2"/>
<text x="373.6" y="264.5" font-size="12" text-anchor="end" fill="#0b0b0b">40%</text>
